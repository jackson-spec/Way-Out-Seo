name: seo-growth

on:
  schedule:
    # Mon/Wed/Fri 13:00 UTC (9am Eastern during daylight time, 8am in winter)
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
  push:
    paths: ["seo/scripts/**", "seo/tests/**", "seo/config/**"]

permissions:
  contents: write

concurrency:
  group: seo-growth
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: seo/requirements.txt }
      - run: pip install -r seo/requirements.txt
      - run: python -m pytest seo/tests -q

  run:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: seo/requirements.txt }
      - run: pip install -r seo/requirements.txt
      - name: Run /seo-growth cycle
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        # Exit code 1 means every data step failed; still commit the report so the failure is visible.
        run: python seo/scripts/run.py || echo "::warning::No data step succeeded this run; see the report"
      - name: Commit snapshot, report, drafts and queue state
        # Only run outputs are committed. Nothing is sent or deployed to wayout.design.
        run: |
          git config user.name "seo-growth-bot"
          git config user.email "seo-growth-bot@users.noreply.github.com"
          git add seo/snapshots seo/reports seo/drafts seo/data
          git diff --cached --quiet || git commit -m "seo-growth run $(date -u +%F)"
          git push
